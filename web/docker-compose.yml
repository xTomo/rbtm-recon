version: '2.4'  # work with docker-compose 1.25.4
services:
  test:
    runtime: nvidia
    image: "nvidia/cuda:12.1.0-devel-ubuntu18.04"
    command: "nvidia-smi"
  reconstructor:
    runtime: nvidia
    build: rbtmrecon/
    volumes:
      - /diskmnt/fast/robotom:/fast
      - /diskmnt/a/makov/robotom/:/storage
      - /home/robotom/rbtm_data/rbtm_storage/data/experiments:/exp_src:ro
    restart: unless-stopped
    external_links:
      - rbtmstorage_server_1
    # network_mode: bridge
    networks:
      - default
      - rbtmstorage_default
    container_name: web_reconstructor_1
  reconstructor-jupyter:
    runtime: nvidia
    build: rbtmrecon/
    command: bash -c ". /opt/conda/etc/profile.d/conda.sh && conda activate xrecon && umask 0002 && cd /rbtm/recon/ && jupyter lab"
#    runtime: nvidia
    volumes:
      - /diskmnt/fast/robotom:/fast
      - /diskmnt/a/makov/robotom/:/storage
      - /home/robotom/rbtm_data/rbtm_storage/data/experiments:/exp_src:ro
    restart: unless-stopped
    external_links:
      - rbtmstorage_server_1
    # network_mode: bridge
    networks:
      - default
      - rbtmstorage_default
    ports:
      - "5551:5551"
    container_name: web_reconstructor_jupyter_1
  web:
    build: rbtmwebrecon/
    depends_on:
      database:
        # Ждём готовности MongoDB, а не просто старта контейнера
        condition: service_healthy
    volumes:
      - /diskmnt/a/makov/robotom/:/webrbtm/webrecon/static/tomo_data
    restart: unless-stopped
    external_links:
      - rbtmstorage_server_1
    # network_mode: bridge
    networks:
      - default
      - rbtmstorage_default
    ports:
      - "5550:5550"
    container_name: web_web_1
  database:
    image: mongo:4.0
    ports:
       - "27017:27017"
    # network_mode: bridge
    container_name: web_database_1
    volumes:
      # ВНИМАНИЕ: путь относительный — он раскрывается от каталога, в котором
      # запускается docker-compose (обычно rbtm-recon/web). При запуске из
      # другого каталога Mongo стартует с ПУСТОЙ базой и очередь «теряется».
      # Решение о переносе на абсолютный путь — за владельцем стенда.
      - ./data/db:/data/db
    healthcheck:
      # mongo:4.0 — старый клиент, mongosh появился только в mongo:5+
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  rbtmstorage_default:
    external: true
