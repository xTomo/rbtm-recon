<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    {% if title %}
        <title>{{ title }}</title>
    {% else %}
        <title>Tomo reconstructor</title>
    {% endif %}

    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-4.1.3-dist/css/bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='jquery/jquery-3.3.1.min.js') }}" type="text/javascript"></script>
    <script src="{{ url_for('static', filename='bootstrap-4.1.3-dist/js/bootstrap.js') }}" type="text/javascript"></script>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
        <a class="navbar-brand" href="{{ url_for('view_tomo_objects') }}">🔬 Tomo Reconstructor</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('view_tomo_objects') }}">Объекты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('view_queue') }}">📋 Очередь</a>
                </li>
            </ul>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
